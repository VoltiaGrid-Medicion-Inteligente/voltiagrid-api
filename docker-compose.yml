# Local ecosystem (US-14). One command: `make up` (or `docker compose up -d --build`).
# Every service joins the `voltia` network; data lives in named volumes and survives restarts.
# Startup order (T-14.2): db and rabbitmq healthy -> migrate-seed finished -> APIs and simulator.
# Every long-running service has a healthcheck: `docker compose ps` shows (healthy) when it is ready.
# Configuration review (T-14.6): no value is written here, everything comes from .env; secrets use
# ${VAR:?} so compose stops with a clear message if one is missing; ports listen only on 127.0.0.1.

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

# Same check for every API: GET /health must answer within 2 seconds.
x-api-healthcheck: &api-healthcheck
  interval: 10s
  timeout: 3s
  start_period: 15s
  retries: 5

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [voltia]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [voltia]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: migrations + seed. The services that read F4 wait until it finishes.
  migrate-seed:
    build:
      context: .
      dockerfile: seed/Dockerfile
    environment:
      DATABASE_URL: *database-url
      MODE: ${MODE:-dev}
      SEED: ${SEED:-42}
      DEFECT_RATE: ${DEFECT_RATE:-0.02}
    networks: [voltia]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  f3-simulator:
    build:
      context: .
      dockerfile: simulators/concentrator/Dockerfile
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      SIM_SEED: ${SIM_SEED:-42}
      SIM_METERS: ${SIM_METERS:-0}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-10}
      SIM_START: ${SIM_START:-2013-01-01T00:00:00Z}
      SIM_OUTAGE_METERS: ${SIM_OUTAGE_METERS:-0}
      SIM_OUTAGE_HOURS: ${SIM_OUTAGE_HOURS:-24}
      DEFECT_RATE: ${DEFECT_RATE:-0.02}
    networks: [voltia]
    restart: unless-stopped
    healthcheck:
      # The simulator has no HTTP port: healthy = it can reach the broker it publishes to.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq', 5672), 2)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully

  api-customer-consumption:
    build:
      context: .
      dockerfile: app/api/customer_consumption/Dockerfile
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:?set DEMO_CUSTOMER_PASSWORD in .env}
      DEMO_INTERNAL_PASSWORD: ${DEMO_INTERNAL_PASSWORD:?set DEMO_INTERNAL_PASSWORD in .env}
      SIM_SEED: ${SIM_SEED:-42}
      DEFECT_RATE: ${DEFECT_RATE:-0.02}
    ports:
      - "127.0.0.1:8001:8001"
    networks: [voltia]
    restart: unless-stopped
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
    depends_on:
      db:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully

  api-network-inventory:
    build:
      context: .
      dockerfile: app/api/network_inventory/Dockerfile
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8003:8003"
    networks: [voltia]
    restart: unless-stopped
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
    depends_on:
      db:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully

networks:
  voltia:
    name: voltia

volumes:
  pgdata:
  rabbitmqdata:
