# F5 transformer metering simulator on EKS (US-50, T-50.2; ADR-014). Same image, port, health check and variables as
# its ECS task definition (infra/envs/dev, api-transformer-metering): the comparison is only the orchestrator.
# infra/scripts/eks-deploy-f5.ps1 replaces the placeholder image with the ECR image of the account and tag, and sets
# the database host; the user and password come from the
# Secret f5-db, which the script creates from Secrets Manager (nothing secret in this file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f5
  namespace: voltiagrid
  labels:
    app.kubernetes.io/name: f5
    app.kubernetes.io/part-of: voltiagrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: f5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: f5
        app.kubernetes.io/part-of: voltiagrid
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # the user "api" of the image; numeric so Kubernetes can check it is not root
      containers:
        - name: f5
          image: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/voltiagrid/api-transformer-metering:TAG
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: ROOT_PATH
              value: ""
            - name: SIM_SEED
              value: "42"
            - name: DB_SSLMODE
              value: require
          envFrom:
            - configMapRef:
                name: f5-db       # DB_HOST, DB_PORT, DB_NAME
            - secretRef:
                name: f5-db       # DB_USER, DB_PASSWORD
          resources:              # same size as the ECS task: 0.25 vCPU, 512 MB
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          readinessProbe:         # no traffic until it answers
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:          # restarted if it stops answering (the ECS health check)
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
